name: Build Self Cult of Agents APK
on:
  push:
    branches: [main, feature/self-cult-agentic-reality]
    paths:
      - 'self-cult-source.zip'
      - '.github/workflows/self-cult-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract complete original source
        run: unzip -q self-cult-source.zip -d .
      - name: Verify two-person exchange and approval
        run: cd self-cult && npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools from preinstalled runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile development APK
        run: bash self-cult/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Self-Cult-of-Agents-APK
          path: self-cult/dist/Self-Cult-of-Agents.apk
          if-no-files-found: error
          retention-days: 30
