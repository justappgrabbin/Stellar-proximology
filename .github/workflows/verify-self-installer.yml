name: Verify Stellar Self Installer

on:
  push:
    branches:
      - integration/self-installer
  pull_request:
    branches:
      - integration/adaptive-seed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout self-installer branch
        uses: actions/checkout@v4

      - name: Checkout execution and state-space donor
        uses: actions/checkout@v4
        with:
          repository: justappgrabbin/Back-up-
          path: donors/backup

      - name: Checkout neural donor
        uses: actions/checkout@v4
        with:
          repository: justappgrabbin/LCM-State-space-
          path: donors/lcm

      - name: Assemble self-installing Stellar
        run: |
          chmod +x scripts/assemble.sh scripts/build-apk-linux.sh scripts/fetch-runtime-assets.sh
          bash scripts/assemble.sh

      - name: Build Android chamber
        run: docker build -f container/Containerfile -t stellar-proximology-builder .

      - name: Compile and verify APK
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            stellar-proximology-builder \
            bash /workspace/scripts/build-apk-linux.sh

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: stellar-self-installer-verification
          path: |
            dist/Stellar-Proximology.apk
            dist/Stellar-Proximology-source.zip
            docs/SELF-INSTALL.md
            docs/ADAPTIVE-SEED.md
            docs/MCP-COMPUTER.md
          if-no-files-found: error
          retention-days: 30
